# Canonical host: www.armantech.om (apex redirects)
server {
    listen 80;
    listen [::]:80;
    server_name armantech.om;
    return 301 https://www.armantech.om$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.armantech.om _;

    root /var/www/armantech;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    # Static asset caching
    location ~* \.(css|js|svg|png|jpg|jpeg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
