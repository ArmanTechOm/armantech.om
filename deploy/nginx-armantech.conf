# Canonical host: www.armantech.om (apex redirects)
server {
    listen 80;
    listen [::]:80;
    server_name armantech.om;
    return 301 https://www.armantech.om$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.armantech.om _;

    root /var/www/armantech;
    index index.html;
    error_page 404 /404.html;

    # Server-local extras (not tracked in this repo)
    include /etc/nginx/armantech-extra/*.conf;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    # Static asset caching
    location ~* \.(css|js|svg|png|jpg|jpeg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # HTML: always revalidate so deploys show up immediately
    # (add_header in a location drops server-level headers, so repeat them)
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}
